# Solid Cable, in the app's database, so a broadcast from anywhere (a job, a console) reaches the browsers connected to
# the web server: each message is written to a table, which the server checks every 0.1 seconds.
development:
  adapter: solid_cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

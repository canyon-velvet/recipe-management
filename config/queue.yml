# Solid Queue: the jobs (imports, the assistant's replies) run inside Puma as threads (config/puma.rb), so a worker
# looks for a new job every 0.1 seconds and a dispatcher moves jobs that were scheduled for later (retries) every second.
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default

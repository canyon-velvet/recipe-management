# Render Blueprint: everything the app runs on in production (see docs/deploy.md). Render creates these from the
# repo when you set up the Blueprint, and keeps them in sync with this file. Plans and regions are Render's
# (https://render.com/docs/blueprint-spec); a region can't be changed once created.
#
# One web service and its database. The background jobs (imports, the assistant's replies) run inside the web service
# (Solid Queue, config/puma.rb), and the jobs, the live updates and the rate limits' counters are all kept in the
# database (Solid Queue, Solid Cable, Solid Cache): no Redis and no separate worker.
#
# RAILS_MASTER_KEY is the contents of config/credentials/production.key: it unlocks production's own credentials,
# config/credentials/production.yml.enc (secret_key_base, the Anthropic key), not development's. Render asks for it
# when the Blueprint is created (sync: false).
#
# Deploys are manual (autoDeployTrigger: off): a merge to main doesn't deploy the app. To release, use Manual Deploy.
# A merge that changes this file is the exception: Render syncs the Blueprint and redeploys the services it changes
# (unless the Blueprint's Auto Sync is off).

services:
  - type: web
    name: recipe-management-web
    runtime: docker
    plan: 0.5c-512mb
    region: ohio
    autoDeployTrigger: "off"
    healthCheckPath: /up
    # A deploy stops the old server with SIGTERM; it gets this long (Render's default is 30) to finish the jobs still
    # running (Solid Queue's shutdown_timeout, 50 seconds, config/environments/production.rb).
    maxShutdownDelaySeconds: 60
    # Before each deploy goes live: create or migrate the database, and seed the tags. db/seeds.rb can run every time:
    # it adds no users in production, and leaves what users changed alone.
    preDeployCommand: ./bin/rails db:prepare db:seed
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: recipe-management-db
          property: connectionString
      # The background jobs run inside Puma (config/puma.rb).
      - key: SOLID_QUEUE_IN_PUMA
        value: "1"
      # Thruster takes Render's traffic on its port (PORT, 10000) and runs Puma behind it on 3000, so nothing needs
      # port 80.
      - key: THRUSTER_HTTP_PORT
        value: 10000

databases:
  - name: recipe-management-db
    plan: 0.1c-256mb
    region: ohio
    # Reachable only from the app's own services on Render.
    ipAllowList: []
